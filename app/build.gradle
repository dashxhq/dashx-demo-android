import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
    id 'kotlinx-serialization'
}

android {
    namespace 'com.dashxdemo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dashxdemo.app'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.0.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions 'environment'
    productFlavors {
        staging {
            dimension 'environment'
            buildConfigField 'java.lang.String', 'DASHX_PUBLIC_KEY', '"ft3tP2wJlQB5NSdYrjU8UylH"'
            buildConfigField 'java.lang.String', 'DASHX_BASE_URI', '"https://api.dashx-staging.com/graphql"'
            buildConfigField 'java.lang.String', 'DASHX_TARGET_ENVIRONMENT', '"staging"'
            buildConfigField 'java.lang.String', 'BASE_URL', '"https://dashxdemo.com/"'
        }

        production {
            dimension 'environment'
            buildConfigField 'java.lang.String', 'DASHX_PUBLIC_KEY', '"1rGE0HWa6Su8F9kZVDpZICYb"'
            buildConfigField 'java.lang.String', 'DASHX_BASE_URI', '"https://api.dashx-staging.com/graphql"'
            buildConfigField 'java.lang.String', 'DASHX_TARGET_ENVIRONMENT', '"production"'
            buildConfigField 'java.lang.String', 'BASE_URL', '"https://dashxdemo.com/"'
        }

        mock {
            dimension 'environment'
            buildConfigField 'java.lang.String', 'DASHX_PUBLIC_KEY', '"0nvA5vBRv2MiD1wJPT6y4Dw1"'
            buildConfigField 'java.lang.String', 'DASHX_BASE_URI', '"https://api.dashx-staging.com/graphql"'
            buildConfigField 'java.lang.String', 'DASHX_TARGET_ENVIRONMENT', '"staging"'
            buildConfigField 'java.lang.String', 'BASE_URL', '"http://10.0.2.2:8080/"'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
        languageVersion.set(KotlinVersion.KOTLIN_2_5)
        apiVersion.set(KotlinVersion.KOTLIN_2_5)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    implementation 'com.dashx:dashx-android:1.1.5'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.0'

    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
